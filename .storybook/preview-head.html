  so it cannot pick up the app's self-hosted next/font setup. Keep the Google
  Fonts link here so stories use the same typefaces as the real site; the app
  itself loads fonts through next/font (styles/fonts.ts).
-->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
