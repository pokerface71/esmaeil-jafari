<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="0.5" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.25" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.8" cy="0.85" r="0.55">
      <stop offset="0" stop-color="#d946ef" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow1)"/>
  <rect width="800" height="450" fill="url(#glow2)"/>

  <!-- dot grid -->
  <g fill="#a5b4fc" fill-opacity="0.12">
    <circle cx="60" cy="60" r="1.5"/><circle cx="90" cy="60" r="1.5"/><circle cx="120" cy="60" r="1.5"/><circle cx="150" cy="60" r="1.5"/>
    <circle cx="60" cy="90" r="1.5"/><circle cx="90" cy="90" r="1.5"/><circle cx="120" cy="90" r="1.5"/><circle cx="150" cy="90" r="1.5"/>
    <circle cx="60" cy="120" r="1.5"/><circle cx="90" cy="120" r="1.5"/><circle cx="120" cy="120" r="1.5"/><circle cx="150" cy="120" r="1.5"/>
    <circle cx="650" cy="330" r="1.5"/><circle cx="680" cy="330" r="1.5"/><circle cx="710" cy="330" r="1.5"/><circle cx="740" cy="330" r="1.5"/>
    <circle cx="650" cy="360" r="1.5"/><circle cx="680" cy="360" r="1.5"/><circle cx="710" cy="360" r="1.5"/><circle cx="740" cy="360" r="1.5"/>
    <circle cx="650" cy="390" r="1.5"/><circle cx="680" cy="390" r="1.5"/><circle cx="710" cy="390" r="1.5"/><circle cx="740" cy="390" r="1.5"/>
  </g>

  <!-- code window card -->
  <g transform="translate(230 105)">
    <rect width="340" height="240" rx="20" fill="#0d1117" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>
    <rect width="340" height="40" rx="20" fill="#ffffff" fill-opacity="0.04"/>
    <rect y="20" width="340" height="20" fill="#ffffff" fill-opacity="0.04"/>
    <circle cx="24" cy="20" r="5" fill="#f87171" fill-opacity="0.85"/>
    <circle cx="44" cy="20" r="5" fill="#fbbf24" fill-opacity="0.85"/>
    <circle cx="64" cy="20" r="5" fill="#34d399" fill-opacity="0.85"/>
    <!-- code lines -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
      <text x="26" y="78" fill="#c4b5fd">&lt;<tspan fill="#f0abfc">Article</tspan>&gt;</text>
      <text x="46" y="108" fill="#6ee7b7">const <tspan fill="#93c5fd">blog</tspan> = [<tspan fill="#fde68a">'react'</tspan>, <tspan fill="#fde68a">'next'</tspan>];</text>
      <text x="46" y="138" fill="#93c5fd">blog<tspan fill="#94a3b8">.</tspan><tspan fill="#c4b5fd">map</tspan><tspan fill="#94a3b8">(</tspan><tspan fill="#f0abfc">post</tspan> <tspan fill="#c4b5fd">=&gt;</tspan></text>
      <text x="66" y="168" fill="#6ee7b7">&lt;<tspan fill="#f0abfc">Post</tspan> <tspan fill="#93c5fd">key</tspan><tspan fill="#94a3b8">=</tspan><tspan fill="#fde68a">&#123;post.id&#125;</tspan> /&gt;</text>
      <text x="46" y="198" fill="#94a3b8">)</text>
      <text x="26" y="222" fill="#c4b5fd">&lt;/<tspan fill="#f0abfc">Article</tspan>&gt;</text>
    </g>
  </g>
</svg>
